name: Importar catálogo Aurora

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aurora-ao-vivo
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    outputs:
      mudou: ${{ steps.publicar.outputs.mudou }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/importar-aurora.mjs
      - id: publicar
        run: |
          git add src/data/aurora.json
          if git diff --cached --quiet; then
            echo "mudou=false" >> "$GITHUB_OUTPUT"
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Atualiza estoque e preços da Aurora."
            git push
            echo "mudou=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.publicar.outputs.mudou == 'true'
        run: npm ci
      - if: steps.publicar.outputs.mudou == 'true'
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - if: steps.publicar.outputs.mudou == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: atualizar
    if: needs.atualizar.outputs.mudou == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
