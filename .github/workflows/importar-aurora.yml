name: Importar catálogo Aurora

on:
  workflow_dispatch:

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/importar-aurora.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-catalogo
          path: |
            src/data/aurora.json
            src/data/aurora-sample.json
